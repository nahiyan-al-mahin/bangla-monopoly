<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বাংলা মনোপলি — খেলা</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/board.css">
</head>
<body>
  <!-- Shown until we know who the player is, or when something is wrong -->
  <div id="gameMessage" class="game-message">
    <p id="gameMessageText">লোড হচ্ছে…</p>
    <a id="gameMessageHome" href="/" hidden>হোম পেজে যান</a>
  </div>

  <div id="gameLayout" class="game-layout" hidden>
    <!-- Board + controls. On wide screens the controls sit inside the
         board center; on phones they appear below the board. -->
    <div class="board-area">
      <!-- The board: an 11x11 grid. js/board.js fills in the 40 squares. -->
      <div id="board" class="board">
        <!-- Center area (grid rows/columns 2-10) -->
        <div class="board-center">
          <h1 class="board-title">বাংলা মনোপলি</h1>
          <div id="turnInfo" class="turn-info"></div>
          <div class="dice-row">
            <div id="die1" class="die"></div>
            <div id="die2" class="die"></div>
          </div>
        </div>
      </div>

      <div id="controls" class="controls">
        <p id="turnHint" class="turn-hint"></p>

        <!-- Only visible when the server runs with DEBUG_DICE=1 -->
        <div id="debugDice" class="debug-dice" hidden>
          <span>পরীক্ষার পাশা:</span>
          <select id="debugDie1" aria-label="প্রথম পাশা"></select>
          <select id="debugDie2" aria-label="দ্বিতীয় পাশা"></select>
        </div>

        <div class="control-buttons">
          <button id="rollBtn" type="button" class="control-btn" hidden>🎲 পাশা ফেলো</button>
          <button id="endTurnBtn" type="button" class="control-btn end-btn" hidden>শেষ করুন</button>
        </div>
        <p id="actionError" class="action-error" role="alert"></p>
      </div>
    </div>

    <!-- Side panel: players and event log -->
    <aside class="side-panel">
      <div class="panel-header">
        <h2>খেলোয়াড়</h2>
        <span class="panel-room">রুম: <strong id="gameRoomCode"></strong></span>
      </div>
      <p id="connectionBanner" class="connection-banner" hidden>সংযোগ বিচ্ছিন্ন, আবার চেষ্টা হচ্ছে…</p>
      <ul id="gamePlayers" class="game-players"></ul>

      <h2 class="log-title">ঘটনা</h2>
      <ul id="eventLog" class="event-log"></ul>
    </aside>
  </div>

  <!-- Square detail card (filled in by js/board.js) -->
  <dialog id="detailDialog" class="detail-dialog">
    <div id="detailContent"></div>
    <button id="detailClose" class="detail-close" type="button">বন্ধ করুন</button>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/common.js"></script>
  <script src="js/board.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
